plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.0.34'
group = 'com.Apeiron.globalpackupdater'

base {
    archivesName = 'packupdater'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.commons:commons-compress:1.27.1'
}

// Replace ${version} in mods.toml with the actual project version
processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand('projectVersion': project.version, 'modId': 'packupdater')
    }
}

neoForge {
    version = '26.1.2.122'

    mods {
        "packupdater" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}